    <script>
      // Polyfill/Safeguard for environments where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchHolder = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;
          
          var defineFetchProp = function(obj) {
            try {
              Object.defineProperty(obj, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return fetchHolder;
                },
                set: function(val) {
                  fetchHolder = val;
                }
              });
            } catch (e) {}
          };

          defineFetchProp(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            defineFetchProp(Window.prototype);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            defineFetchProp(globalThis);
          }
        } catch (err) {
          console.warn('Fetch safeguard initialization:', err);
        }
      })();
    </script>
